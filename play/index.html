<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anrlldev world map</title>
<meta name="description" content="Walk around a small pixel island and visit anrlldev's projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0a1a; --night: #13112e; --dusk: #1c1847; --haze: #2a2163;
    --cream: #fff1e8; --lavender: #83769c; --yellow: #ffec27; --orange: #ffa300; --plum: #7e2553; --pink: #ff77a8;
  }
  * { box-sizing: border-box; }
  html { background: #0d1117; }
  body {
    margin: 0; min-height: 100vh; color: var(--cream);
    font: 15px/1.55 'Pixelify Sans', ui-monospace, monospace;
    background: #0d1117;
  }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  a { color: var(--yellow); }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

  /* Pixel window: ink edge, cream ring, lavender ring, as on the profile. */
  .win {
    background: var(--night); border: 3px solid var(--cream);
    box-shadow: 0 0 0 3px var(--ink), inset 0 0 0 3px var(--lavender), inset 0 0 0 6px var(--ink);
  }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .title { display: flex; align-items: baseline; gap: 10px; }
  .title h1 { margin: 0; font-size: 22px; font-weight: 600; color: var(--yellow); text-shadow: 2px 2px 0 var(--plum); }
  .hud { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .chip { padding: 3px 9px; background: var(--ink); border: 2px solid var(--haze); color: var(--cream); }
  .chip b { color: var(--yellow); font-weight: 600; }
  kbd { font: inherit; padding: 0 5px; border: 2px solid var(--lavender); border-bottom-width: 4px; background: var(--dusk); }

  .stage { position: relative; aspect-ratio: 800 / 400; padding: 6px; }
  .world { position: absolute; inset: 6px; overflow: hidden; }
  .world > img { position: absolute; image-rendering: pixelated; pointer-events: none; }
  .world .map { inset: 0; width: 100%; height: 100%; }
  .world .hero { width: 4%; }
  .world .cat { width: 2.5%; }
  @keyframes ping { 50% { opacity: 0; } }

  .dialog { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; margin-top: 18px; padding: 18px 22px; min-height: 150px; }
  .portrait { width: 96px; height: 96px; display: grid; place-items: center; background: var(--dusk); border: 3px solid var(--cream); box-shadow: inset 0 0 0 3px var(--ink); }
  .portrait img { max-width: 72px; max-height: 76px; image-rendering: pixelated; }
  .name { display: inline-block; padding: 1px 10px; margin-bottom: 6px; background: var(--plum); border: 2px solid var(--ink); color: var(--yellow); font-weight: 600; font-size: 14px; }
  .line { margin: 0; min-height: 3.1em; }
  .line .caret { display: inline-block; width: 8px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--yellow); animation: ping 0.8s steps(2) infinite; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 8px 16px; min-height: 40px; font: inherit; font-weight: 600; text-decoration: none;
    color: var(--yellow); background: var(--plum); border: 2px solid var(--ink);
    box-shadow: inset 0 2px 0 var(--pink), inset 0 -4px 0 #3b0f28;
  }
  .btn:hover { filter: brightness(1.15); }
  .actions[hidden] { display: none; }
  .chip.btnlike { cursor: pointer; font: inherit; font-size: 13px; }
  .picker { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(13, 17, 23, .86); z-index: 10; padding: 16px; }
  .picker[hidden] { display: none; }
  .picker .win { padding: 22px 26px; text-align: center; max-width: 420px; width: 100%; }
  .picker h2 { margin: 0 0 6px; }
  .picker p { margin: 0 0 18px; color: var(--lavender); font-size: 13px; }
  .choices { display: flex; gap: 16px; justify-content: center; }
  .choice { display: grid; gap: 8px; justify-items: center; padding: 14px 22px; font: inherit; font-weight: 600; color: var(--cream); background: var(--dusk); border: 3px solid var(--cream); box-shadow: inset 0 -4px 0 var(--ink); cursor: pointer; }
  .choice:hover, .choice:focus-visible { background: var(--haze); }
  .choice img { width: 64px; image-rendering: pixelated; }
  .hint { color: var(--lavender); font-size: 13px; }

  .pad { display: none; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(2, 52px); gap: 6px; justify-content: center; margin: 18px auto 0; }
  @media (pointer: coarse) { .pad { display: grid; } .keys { display: none; } }
  .pad button { background: var(--dusk); border: 2px solid var(--cream); box-shadow: inset 0 -4px 0 var(--ink); cursor: pointer; touch-action: none; user-select: none; }
  .pad button:active { background: var(--haze); box-shadow: none; }
  .pad button::after { content: ''; display: block; width: 14px; height: 14px; margin: auto; background: var(--cream); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
  .pad .right::after { transform: rotate(90deg); } .pad .down::after { transform: rotate(180deg); } .pad .left::after { transform: rotate(270deg); }

  h2 { font-size: 16px; font-weight: 600; color: var(--yellow); margin: 32px 0 12px; }
  .places { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .places li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 14px; }
  .places img { width: 44px; image-rendering: pixelated; }
  .places b { display: block; color: var(--cream); font-weight: 600; }
  .places p { margin: 2px 0 12px; color: var(--lavender); font-size: 13px; line-height: 1.45; }
  footer { margin-top: 32px; font-size: 13px; color: var(--lavender); }

  @media (max-width: 520px) {
    .dialog { grid-template-columns: 64px 1fr; padding: 14px; gap: 12px; }
    .portrait { width: 64px; height: 64px; } .portrait img { max-width: 48px; max-height: 50px; }
  }
  @media (prefers-reduced-motion: reduce) { .ping, .line .caret { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="title"><h1>anrlldev world map</h1></div>
    <div class="hud">
      <span class="chip keys"><kbd>WASD</kbd> or <kbd>arrows</kbd> to walk</span>
      <span class="chip">Visited <b id="count">0</b>/6</span>
      <button class="chip btnlike" id="change" type="button">Change character</button>
    </div>
  </div>

  <div class="stage win" id="stage">
    <div class="world" id="world">
      <img class="map" src="map.svg" alt="Pixel island with a lake, a ring road and six places: Kompas signpost, Ivory tower, Tendril tree, DBLab library, FileFlow workshop and AKARI shrine.">
      <img class="hero" id="hero" src="boy-a.svg" alt="">
      <img class="cat" id="cat" src="cat-a.svg" alt="">
    </div>
  </div>

  <section class="dialog win" aria-live="polite">
    <div class="portrait"><img id="p-img" src="boy-a.svg" alt=""></div>
    <div>
      <span class="name" id="p-name">ANRLLDEV</span>
      <p class="line"><span id="p-text"></span><span class="caret"></span></p>
      <div class="actions" id="p-actions" hidden>
        <a class="btn" id="p-link" href="#">Open site</a>
        <span class="hint keys">or press <kbd>Enter</kbd></span>
      </div>
    </div>
  </section>

  <div class="pad" aria-label="Movement buttons">
    <button class="up" data-dir="up" aria-label="Walk up"></button>
    <button class="left" data-dir="left" aria-label="Walk left"></button>
    <button class="down" data-dir="down" aria-label="Walk down"></button>
    <button class="right" data-dir="right" aria-label="Walk right"></button>
  </div>

  <div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pick-title" hidden>
    <div class="win">
      <h2 id="pick-title">Choose your character</h2>
      <p>You can switch any time with the button at the top.</p>
      <div class="choices">
        <button class="choice" type="button" data-avatar="boy"><img src="boy-a.svg" alt="">Boy</button>
        <button class="choice" type="button" data-avatar="girl"><img src="girl-a.svg" alt="">Girl</button>
      </div>
    </div>
  </div>

  <h2>All places</h2>
  <ul class="places" id="places"></ul>

  <footer><a href="https://github.com/anrlldev-bit">Back to the GitHub profile</a></footer>
</main>

<script src="stops.js"></script>
<script>
  // Map is 200 x 100 cells; positions are the mascot's feet.
  const PLACES = [
    { key: 'kompas', name: 'Kompas Program Studi', x: MAP.stops.kompas[0], y: MAP.stops.kompas[1], url: 'https://kompasprogramstudi.vercel.app',
      text: 'Study-program recommendations for students, based on grades, interests, talents and preferences. NestJS and PostgreSQL.' },
    { key: 'ivory', name: 'Ivory', x: MAP.stops.ivory[0], y: MAP.stops.ivory[1], url: 'https://ivoryapp.vercel.app',
      text: 'A planner for college life: tasks, class schedule, grades and attendance. Works offline and syncs. Node.js, Tauri and PWA.' },
    { key: 'tendril', name: 'Tendril', x: MAP.stops.tendril[0], y: MAP.stops.tendril[1], url: 'https://tendrilapp.vercel.app',
      text: 'An Android chat app that works over Bluetooth, no internet needed. Built with Kotlin and Jetpack Compose.' },
    { key: 'dblab', name: 'DBLab', x: MAP.stops.dblab[0], y: MAP.stops.dblab[1], url: 'https://dblabapp.vercel.app',
      text: 'SQL lessons in Indonesian. Queries run right in the browser with sql.js. Built with Next.js.' },
    { key: 'fileflow', name: 'FileFlow', x: MAP.stops.fileflow[0], y: MAP.stops.fileflow[1], url: 'https://fileflowpc.vercel.app',
      text: 'A desktop app that automates file chores. Built with Tauri.' },
    { key: 'akari', name: 'AKARI', x: MAP.stops.akari[0], y: MAP.stops.akari[1], url: 'https://akarijapaneseclub.vercel.app',
      text: 'Website for a Japanese culture club, with a meetings and attendance area. Next.js and Supabase.' },
  ];
  const IDLE = 'Halo! Walk to one of the six signs on the island to read about it.';
  const NEAR = 12, SPEED = 24;

  // Same shapes the map generator uses, so the mascot stays on land and out of the lake.
  const island = (x, y) => ((x - 100) / 96) ** 4 + ((y - 50) / 47) ** 4 - 0.05 * Math.sin(x * 0.31) - 0.05 * Math.cos(y * 0.45 + x * 0.07);
  const L = MAP.lake, lake = (x, y) => ((x - L.x) / L.rx) ** 2 + ((y - L.y) / L.ry) ** 2;
  const blocks = MAP.objects.filter(o => o.block).map(o => o.block);
  const blocked = (x, y) => blocks.some(([bx, by, bw, bh]) => x >= bx && x < bx + bw && y >= by && y < by + bh);
  const walkable = (x, y) => island(x, y) <= 0.8 && lake(x, y) > 1.3 && !blocked(x, y);

  const $ = id => document.getElementById(id);
  const stage = $('stage'), world = $('world'), hero = $('hero');
  const pos = { x: 100, y: 31 };
  // The cat follows the player's path a short way behind.
  const trail = [], cat = $('cat');
  const held = new Set();
  let current, last = performance.now(), walkClock = 0, typing;

  let avatar = 'boy';
  try { avatar = localStorage.getItem('avatar') || ''; } catch {}
  const picker = $('picker');
  function setAvatar(kind) {
    avatar = kind;
    try { localStorage.setItem('avatar', kind); } catch {}
    hero.src = `${kind}-a.svg`; hero.dataset.f = '';
    if (!current) $('p-img').src = `${kind}-a.svg`;
    picker.hidden = true;
    $('change').focus();
  }
  document.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => setAvatar(b.dataset.avatar)));
  $('change').addEventListener('click', () => { picker.hidden = false; picker.querySelector('.choice').focus(); });
  picker.addEventListener('keydown', e => { if (e.key === 'Escape' && avatar) picker.hidden = true; });
  if (avatar === 'boy' || avatar === 'girl') { hero.src = `${avatar}-a.svg`; $('p-img').src = `${avatar}-a.svg`; }
  else { avatar = 'boy'; picker.hidden = false; }

  let visited = new Set();
  try { visited = new Set(JSON.parse(localStorage.getItem('visited') || '[]')); } catch {}
  const saveVisited = () => { try { localStorage.setItem('visited', JSON.stringify([...visited])); } catch {} };

  function renderPlaces() {
    $('count').textContent = visited.size;
    $('places').innerHTML = PLACES.map(p => `<li class="win"><img src="lm-${p.key}.svg" alt=""><div>
      <b>${p.name}</b><p>${p.text}</p><a class="btn" href="${p.url}">Open site</a></div></li>`).join('');
  }

  // Scenery as separate images, stacked by the row each one stands on.
  const pct = (v, of) => `${(v / of) * 100}%`;
  for (const o of MAP.objects) {
    const img = document.createElement('img');
    img.src = o.src; img.alt = '';
    Object.assign(img.style, { left: pct(o.x, 200), top: pct(o.y, 100), width: pct(o.w, 200), zIndex: String(o.z * 10) });
    world.appendChild(img);
  }

  function type(str) {
    clearInterval(typing);
    const out = $('p-text');
    let i = 0;
    out.textContent = '';
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { out.textContent = str; return; }
    typing = setInterval(() => { out.textContent = str.slice(0, ++i); if (i >= str.length) clearInterval(typing); }, 18);
  }

  function show(place) {
    if (place === current) return;
    current = place;
    if (place) {
      $('p-name').textContent = place.name.toUpperCase();
      $('p-img').src = `lm-${place.key}.svg`;
      $('p-link').href = place.url;
      $('p-link').textContent = `Open ${place.name}`;
      $('p-actions').hidden = false;
      type(place.text);
      if (!visited.has(place.key)) { visited.add(place.key); saveVisited(); renderPlaces(); }
    } else {
      $('p-name').textContent = 'ANRLLDEV';
      $('p-img').src = `${avatar}-a.svg`;
      $('p-actions').hidden = true;
      type(visited.size === PLACES.length ? 'You found every place. Thanks for walking around!' : IDLE);
    }
  }

  const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  addEventListener('keydown', e => {
    if (!picker.hidden) return;
    if (KEYS[e.code]) { held.add(KEYS[e.code]); e.preventDefault(); }
    if (e.code === 'Enter' && current && document.activeElement === document.body) location.href = current.url;
  });
  addEventListener('keyup', e => { if (KEYS[e.code]) held.delete(KEYS[e.code]); });
  addEventListener('blur', () => held.clear());
  document.querySelectorAll('.pad button').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('pointerdown', e => { held.add(dir); try { btn.setPointerCapture(e.pointerId); } catch {} });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, () => held.delete(dir)));
  });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    let dx = 0, dy = 0;
    if (held.has('left')) dx--; if (held.has('right')) dx++;
    if (held.has('up')) dy--; if (held.has('down')) dy++;
    if (dx || dy) {
      const len = Math.hypot(dx, dy), step = SPEED * dt;
      const nx = pos.x + (dx / len) * step, ny = pos.y + (dy / len) * step;
      if (walkable(nx, ny)) { pos.x = nx; pos.y = ny; }
      else if (walkable(nx, pos.y)) pos.x = nx;
      else if (walkable(pos.x, ny)) pos.y = ny;
      walkClock += dt;
      const next = `${avatar}-${Math.floor(walkClock * 6) % 2 ? 'b' : 'a'}.svg`;
      if (hero.dataset.f !== next) { hero.dataset.f = next; hero.src = next; }
    }
    const cell = world.clientWidth / 200;
    hero.style.left = pct(Math.round(pos.x) - 4, 200);
    hero.style.top = pct(Math.round(pos.y) - 10, 100);
    hero.style.zIndex = String(Math.round(pos.y) * 10 + 5);
    const tail = trail[trail.length - 1];
    if (!tail || Math.hypot(tail.x - pos.x, tail.y - pos.y) > 0.5) trail.push({ x: pos.x, y: pos.y });
    if (trail.length > 24) trail.shift();
    const c = trail.length > 16 ? trail[trail.length - 17] : { x: pos.x - 6, y: pos.y };
    cat.style.left = pct(Math.round(c.x) - 2.5, 200);
    cat.style.top = pct(Math.round(c.y) - 4.5, 100);
    cat.style.zIndex = String(Math.round(c.y) * 10 + 4);
    const cf = `cat-${Math.floor(walkClock * 6) % 2 ? 'b' : 'a'}.svg`;
    if (cat.dataset.f !== cf) { cat.dataset.f = cf; cat.src = cf; }
    show(PLACES.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) < NEAR) || null);
    requestAnimationFrame(frame);
  }

  renderPlaces();
  type(visited.size === PLACES.length ? 'You found every place. Thanks for walking around!' : IDLE);
  current = null;
  requestAnimationFrame(frame);
</script>
</body>
</html>
